services:
  - type: web
    name: washma-portfolio
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 32 --timeout 60 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    disk:
      name: portfolio-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DATA_DIR
        value: /var/data
      - key: SECURE_COOKIES
        value: "1"
