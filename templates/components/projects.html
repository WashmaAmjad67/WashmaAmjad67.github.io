{% from 'components/icons.html' import icon %}
{% set labels={'long':'YouTube Long-Form','short':'Short-Form Reels','color':'Color Grading & Sound Design'} %}
{% for item in projects %}<article class="portfolio-card" data-category="{{ item.category }}" {% if item.category!='long' %}hidden{% endif %}><button class="portfolio-open" data-title="{{ item.title }}" data-description="{{ item.detail }}" data-image="{{ media[item.media].url }}" data-alt="{{ media[item.media].alt }}" data-category-label="{{ labels[item.category] }}" aria-label="View {{ item.title }}"><div class="portfolio-image"><img src="{{ media[item.media].url }}" alt="{{ media[item.media].alt }}" width="960" height="600" loading="lazy"><span class="expand-icon">{{ icon('arrow') }}</span></div><div class="portfolio-card-meta"><span>{{ labels[item.category] }}</span><span>{{ '%02d'|format(loop.index) }} / {{ projects|length }}</span></div><h3>{{ item.title }}</h3><p>{{ item.description }}</p></button></article>{% endfor %}<p class="portfolio-empty collection-empty" hidden>No projects in this category yet. Explore another category or check back soon.</p>
